<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22589a"/>
      <stop offset="100%" stop-color="#1b4a80"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle top-shine to give depth -->
  <rect x="1" y="1" width="30" height="14" rx="6" fill="white" opacity="0.09"/>

  <!-- Center divider line (mirrors the mark's ::after pseudo-element) -->
  <line x1="16" y1="7" x2="16" y2="25" stroke="white" stroke-width="0.8" opacity="0.22"/>

  <!-- Left S -->
  <text
    x="9.5" y="22.5"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="15"
    font-weight="bold"
    font-style="italic"
    fill="white"
    text-anchor="middle">S</text>

  <!-- Right S -->
  <text
    x="22.5" y="22.5"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="15"
    font-weight="bold"
    font-style="italic"
    fill="white"
    text-anchor="middle">S</text>
</svg>
